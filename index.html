<!-- SMLQUIZ: navigazione indietro globale -->
<style>
#sml-global-back{position:static;flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;min-height:40px;margin:0 14px 0 0;padding:0 13px;border:1px solid rgba(102,220,195,.42);border-radius:10px;background:rgba(9,28,42,.96);color:#e7f5f3;box-shadow:0 4px 14px rgba(0,0,0,.16);font:650 12px system-ui,-apple-system,'Segoe UI',sans-serif;cursor:pointer;backdrop-filter:blur(12px);transition:background .18s,border-color .18s,transform .18s}
#sml-global-back:hover{background:#153746;border-color:#69ddc4;transform:translateY(-2px)}
#sml-global-back svg{width:17px;height:17px;stroke:#69ddc4;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:600px){#sml-global-back{min-height:40px;margin-right:8px;padding:0 10px;border-radius:10px;font-size:11px}}
</style>
<button id="sml-global-back" type="button" aria-label="Torna alla pagina precedente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"/></svg><span>Indietro</span></button>
<script>
(()=>{const b=document.getElementById('sml-global-back');if(!b||b.dataset.ready)return;b.dataset.ready='1';const place=()=>{const appHeader=document.querySelector('.app-shell:not(.is-study-mode) .topbar');const publicHeader=document.querySelector('.public-header');if(appHeader){if(appHeader.querySelector('.screen-back-button')){b.hidden=true;return;}b.hidden=false;if(b.parentElement!==appHeader||appHeader.firstElementChild!==b)appHeader.insertBefore(b,appHeader.firstChild);return;}if(publicHeader){b.hidden=false;const brand=publicHeader.querySelector('.public-brand');const target=brand||publicHeader.firstChild;if(b.parentElement!==publicHeader||b.nextSibling!==target)publicHeader.insertBefore(b,target);return;}b.hidden=true;};place();new MutationObserver(place).observe(document.documentElement,{childList:true,subtree:true});b.addEventListener('click',()=>{if(window.history.length>1){window.history.back();return;}window.location.assign('/');});})();
</script>
