<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#070b17">
  <title>Pagina non trovata | SMLQUIZ Pro</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b17;color:#eef2ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#182447 0,transparent 55%),#070b17}
    main{width:min(100%,560px);text-align:center;padding:clamp(28px,6vw,56px);border:1px solid #273453;border-radius:24px;background:rgba(13,20,39,.92);box-shadow:0 24px 80px #0007}
    .brand{font-size:13px;letter-spacing:.18em;font-weight:850;color:#a78bfa}.code{font-size:clamp(68px,16vw,104px);line-height:1;font-weight:900;letter-spacing:-.07em;margin:28px 0 14px;color:#c4b5fd}
    h1{font-size:clamp(23px,5vw,32px);margin:0 0 12px}p{color:#aebbd4;line-height:1.7;margin:0 auto;max-width:410px}
    nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;text-decoration:none;font-weight:750}
    .primary{background:#a78bfa;color:#171127}.secondary{border:1px solid #394867;color:#e6eaff}
    a:focus-visible{outline:3px solid #fff;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="brand">SMLQUIZ PRO</div>
    <div class="code" aria-hidden="true">404</div>
    <h1>Questa pagina non esiste</h1>
    <p>Il collegamento potrebbe essere errato oppure la pagina è stata spostata. Puoi tornare alla home pubblica o aprire direttamente gli strumenti di studio.</p>
    <nav aria-label="Navigazione">
      <a class="primary" href="/">Torna alla home</a>
      <a class="secondary" href="/quiz">Apri la piattaforma</a>
    </nav>
  </main>
</body>
</html>
