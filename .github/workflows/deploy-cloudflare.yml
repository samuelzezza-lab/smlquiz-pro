name: Deploy SMLQUIZ Pro to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check required deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -eu
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_TURNSTILE_SITE_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::GitHub Actions secret $name is missing."
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm install
      - name: Build production site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_INFOLINKS_PID: ${{ vars.VITE_INFOLINKS_PID }}
          VITE_INFOLINKS_WSID: ${{ vars.VITE_INFOLINKS_WSID }}
          VITE_STRIPE_CHECKOUT_ENABLED: 'false'
      - name: Create Cloudflare Pages project if needed
        run: npx wrangler pages project create smlquiz-pro --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name smlquiz-pro --branch main
      - name: Attach smlquiz.it to the production Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          existing="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/smlquiz-pro/domains")"
          if echo "$existing" | jq -e '.result[]? | select(.name == "smlquiz.it")' >/dev/null; then
            echo "smlquiz.it is already attached to smlquiz-pro"
          else
            response="$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"smlquiz.it"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/smlquiz-pro/domains")"
            if ! echo "$response" | jq -e '.success == true' >/dev/null; then
              echo "::error::Could not attach smlquiz.it: $(echo "$response" | jq -c '.errors // .messages')"
              exit 1
            fi
            echo "ATTACHED_CUSTOM_DOMAIN=$(echo "$response" | jq -r '.result.name') status=$(echo "$response" | jq -r '.result.status')"
          fi
      - name: Verify SMLQUIZ custom domain is attached to deployed Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          projects="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?page=1")"
          found=0
          echo "$projects" | jq -r '.result[].name' | while read -r project; do
            response="$(curl -sS -w '\nHTTP_STATUS:%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains")"
            body="${response%$'\n'HTTP_STATUS:*}"
            status="${response##*HTTP_STATUS:}"
            if [ "$status" != "200" ]; then
              echo "DOMAIN_LOOKUP_ERROR project=$project http=$status body=$(echo "$body" | jq -c '.errors // .messages // .success')"
            else
              names="$(echo "$body" | jq -r '.result[]?.name' | paste -sd, -)"
              echo "PAGES_PROJECT project=$project domains=${names:-none}"
              echo "$body" | jq -r '.result[]?.name | select(. == "smlquiz.it" or . == "www.smlquiz.it")' | while read -r domain; do
                details="$(echo "$body" | jq -c --arg domain "$domain" '.result[] | select(.name == $domain) | {name,status,verification_data,validation_data}')"
                echo "CUSTOM_DOMAIN_MATCH project=$project details=$details"
              done
            fi
          done
