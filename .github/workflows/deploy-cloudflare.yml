name: Deploy SMLQUIZ Pro to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check required deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -eu
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_TURNSTILE_SITE_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::GitHub Actions secret $name is missing."
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm install
      - name: Generate PNG icons for Android and iOS installation
        run: python3 scripts/generate-pwa-icons.py
      - name: Build production site
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_INFOLINKS_PID: ${{ vars.VITE_INFOLINKS_PID }}
          VITE_INFOLINKS_WSID: ${{ vars.VITE_INFOLINKS_WSID }}
          VITE_STRIPE_CHECKOUT_ENABLED: 'false'
      - name: Create Cloudflare Pages project if needed
        run: npx wrangler pages project create smlquiz-pro --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name smlquiz-pro --branch main
      - name: Attach apex and www domains to the production Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/smlquiz-pro/domains"
          existing="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint")"
          for domain in smlquiz.it www.smlquiz.it; do
            if echo "$existing" | jq -e --arg domain "$domain" '.result[]? | select(.name == $domain)' >/dev/null; then
              echo "$domain is already attached to smlquiz-pro"
            else
              response="$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$(jq -nc --arg name "$domain" '{name:$name}')" "$endpoint")"
              if ! echo "$response" | jq -e '.success == true' >/dev/null; then
                echo "::error::Could not attach $domain: $(echo "$response" | jq -c '.errors // .messages')"
                exit 1
              fi
              echo "ATTACHED_CUSTOM_DOMAIN=$(echo "$response" | jq -r '.result.name') status=$(echo "$response" | jq -r '.result.status')"
            fi
          done
      - name: Point apex and www DNS to the production Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          zones="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=smlquiz.it")"
          zone_id="$(echo "$zones" | jq -r '.result[0].id // empty')"
          if [ -z "$zone_id" ]; then
            echo "::warning::The smlquiz.it DNS zone is managed outside this Cloudflare account; both smlquiz.it and www.smlquiz.it must CNAME to smlquiz-pro.pages.dev at the current DNS provider."
            exit 0
          fi
          for domain in smlquiz.it www.smlquiz.it; do
            records="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$domain")"
            echo "$records" | jq -r --arg domain "$domain" '.result[] | select(.name == $domain and (.type == "A" or .type == "AAAA" or .type == "CNAME")) | .id' | while read -r record_id; do
              [ -z "$record_id" ] && continue
              deleted="$(curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id")"
              echo "$deleted" | jq -e '.success == true' >/dev/null
            done
            payload="$(jq -nc --arg name "$domain" '{type:"CNAME",name:$name,content:"smlquiz-pro.pages.dev",ttl:1,proxied:true}')"
            created="$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records")"
            if ! echo "$created" | jq -e '.success == true' >/dev/null; then
              echo "::error::Could not point $domain to Pages: $(echo "$created" | jq -c '.errors // .messages')"
              exit 1
            fi
            echo "DNS_CONFIGURED name=$(echo "$created" | jq -r '.result.name') target=$(echo "$created" | jq -r '.result.content') proxied=$(echo "$created" | jq -r '.result.proxied')"
          done
      - name: Verify SMLQUIZ custom domain is attached to deployed Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          projects="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?page=1")"
          found=0
          echo "$projects" | jq -r '.result[].name' | while read -r project; do
            response="$(curl -sS -w '\nHTTP_STATUS:%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains")"
            body="${response%$'\n'HTTP_STATUS:*}"
            status="${response##*HTTP_STATUS:}"
            if [ "$status" != "200" ]; then
              echo "DOMAIN_LOOKUP_ERROR project=$project http=$status body=$(echo "$body" | jq -c '.errors // .messages // .success')"
            else
              names="$(echo "$body" | jq -r '.result[]?.name' | paste -sd, -)"
              echo "PAGES_PROJECT project=$project domains=${names:-none}"
              echo "$body" | jq -r '.result[]?.name | select(. == "smlquiz.it" or . == "www.smlquiz.it")' | while read -r domain; do
                details="$(echo "$body" | jq -c --arg domain "$domain" '.result[] | select(.name == $domain) | {name,status,verification_data,validation_data}')"
                echo "CUSTOM_DOMAIN_MATCH project=$project details=$details"
              done
            fi
          done
