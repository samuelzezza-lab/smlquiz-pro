name: Deploy SMLQUIZ Pro clean preview

on:
  push:
    branches: [adsense-rebuild]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smlquiz-clean-preview-${{ github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: adsense-rebuild
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build clean preview
        run: npm run build
      - name: Deploy isolated preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name smlquiz-pro --branch adsense-review
