name: SMLQUIZ Pro CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Check dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Generate PNG icons for Android and iOS installation
        run: python3 scripts/generate-pwa-icons.py
      - run: npm run build
