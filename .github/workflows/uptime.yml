name: SMLQUIZ uptime monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smlquiz-uptime
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check custom domain and Pages origin
        run: |
          set -eu
          domain_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/smlquiz-domain.html --write-out '%{http_code}' https://smlquiz.it/ || true)"
          if [ "$domain_status" = "200" ]; then
            grep -qi "SMLQUIZ" /tmp/smlquiz-domain.html
          elif [ "$domain_status" = "403" ]; then
            echo "::warning::The custom domain blocks automated GitHub probes with HTTP 403; verifying the deployed Pages origin separately."
          else
            echo "::error::Custom domain returned HTTP $domain_status"
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 3 https://smlquiz-pro.pages.dev/ -o /tmp/smlquiz-origin.html
          grep -qi "SMLQUIZ" /tmp/smlquiz-origin.html
      - name: Check PWA manifest and install icons
        run: |
          set -eu
          curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 3 https://smlquiz-pro.pages.dev/manifest.webmanifest -o /tmp/smlquiz-manifest.json
          grep -q '"display": "standalone"' /tmp/smlquiz-manifest.json
          for icon in icon-192.png icon-512.png; do
            curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 3 "https://smlquiz-pro.pages.dev/$icon" -o "/tmp/$icon"
            test -s "/tmp/$icon"
            file "/tmp/$icon" | grep -q 'PNG image data'
          done
      - name: Check Supabase authentication endpoint
        env:
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -eu
          test -n "$SUPABASE_ANON_KEY"
          curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 3 -H "apikey: $SUPABASE_ANON_KEY" https://fgrwwauwnxvrcgqqpksp.supabase.co/auth/v1/health -o /tmp/smlquiz-auth-health.json
          test -s /tmp/smlquiz-auth-health.json
