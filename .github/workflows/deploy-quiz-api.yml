name: Deploy quiz-api to Supabase
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -eu
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the GitHub Actions secret SUPABASE_ACCESS_TOKEN first."
            exit 1
          fi
      - name: Deploy quiz-api
        run: npx supabase@latest functions deploy quiz-api --project-ref fgrwwauwnxvrcgqqpksp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
